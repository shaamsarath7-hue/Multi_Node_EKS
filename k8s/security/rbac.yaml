apiVersion: v1
kind: Namespace
metadata:
  name: workloads
  labels:
    kubernetes.io/metadata.name: workloads

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-sa
  namespace: workloads

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: workloads
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-sa-pod-reader
  namespace: workloads
subjects:
  - kind: ServiceAccount
    name: workload-sa
    namespace: workloads
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
